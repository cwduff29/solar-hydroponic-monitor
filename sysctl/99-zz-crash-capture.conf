# Installed as /etc/sysctl.d/99-zz-crash-capture.conf by install.sh.
# The name must sort after 98-rpi.conf and 99-sysctl.conf, which set
# kernel.printk = 3 4 1 3 and would otherwise hide kernel errors from the
# console.
#
# Console loglevel 4: errors and worse reach the console, and so the ramoops
# console record, while routine warnings (ufw, wifi) stay out of the 32 KiB
# buffer.
kernel.printk = 4 4 1 7

# Report hung tasks before the 60 s hardware watchdog resets the Pi.
kernel.hung_task_timeout_secs = 30
