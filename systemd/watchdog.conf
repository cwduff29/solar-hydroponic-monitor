# Installed as /etc/systemd/system.conf.d/watchdog.conf by install.sh.
#
# systemd (PID 1) pets the BCM2835 hardware watchdog. If the Pi freezes, the
# watchdog resets it after RuntimeWatchdogSec; RebootWatchdogSec bounds a
# reboot that hangs. waterflow counts these resets as
# pi_boot_reason_total{reason="watchdog"}.
#
# Keep watchdog.enabled=false in config.json: systemd holds /dev/watchdog,
# so the application watchdog in monitor_common.py could not open it.
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=2min
