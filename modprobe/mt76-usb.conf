# Installed as /etc/modprobe.d/mt76-usb.conf by install.sh when a MediaTek
# MT76 USB WiFi dongle is present (for example the Panda PAU0B, MT7610U).
# USB scatter-gather through the Pi Zero's dwc_otg controller is a known
# source of mt76 transfer errors and stalls, so it is turned off.
options mt76_usb disable_usb_sg=1
